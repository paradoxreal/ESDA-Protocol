name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI Trusted Publishing:
# no token is stored anywhere; PyPI trusts this workflow in this repo.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python3 -m pip install build twine
          python3 -m build
          python3 -m twine check dist/*
      - name: Version must match the release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$ver"
          test "$tag" = "$ver"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/esda-protocol/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
